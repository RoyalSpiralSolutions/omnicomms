[package]
name = "omnicomms"
version = "0.1.0"
edition = "2021"
description = "One window, many chat apps — WhatsApp Web, Discord, Telegram and more as tabs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = "2"
base64 = "0.22"

[[bin]]
name = "omnicomms"
path = "src/main.rs"
